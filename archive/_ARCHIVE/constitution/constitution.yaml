constitution:
  name: PADI Semantic Kernel Constitution
  version: "1.0.0"
  status: locked

control_plane:
  version: "1.0.0"

execution_plane:
  version: "1.0.0"

pipeline:
  version: "0.9.3"

planes:

  control:
    responsibility: semantic_truth
    mutable: false

  execution:
    responsibility: semantic_execution
    mutable: false

  operator:
    responsibility: user_interaction
    mutable: true

constitutional_invariants:

  - id: PADI-001
    name: plane_separation
    description: Each plane owns exactly one responsibility.
    enforced: true

  - id: PADI-002
    name: single_execution_entry
    description: All semantic execution enters through the Execution Plane.
    enforced: true

  - id: PADI-003
    name: immutable_contracts
    description: Versioned contracts cannot change without a version increment.
    enforced: true

  - id: PADI-004
    name: deterministic_execution
    description: Identical inputs produce identical semantic outputs.
    enforced: true

  - id: PADI-005
    name: audit_required
    description: Every architectural invariant must be machine verifiable.
    enforced: true

immutable_contracts:

  control_plane:
    - Ontology
    - Taxonomy
    - SHACL
    - Mapper
    - SemanticCompiler
    - MaterializationLedger

  execution_plane:
    - ExecutionPlan
    - ExecutionContext
    - ExecutionRuntime
    - ExecutionOrchestrator
    - ExecutionReport

execution:

  entry_point: ExecutionRuntime

  forbidden_direct_calls:
    - SemanticCompiler
    - InferenceEngine
    - SPARQLEngine
    - Serializer

domain_package:

  required_artifacts:
    - ontology.ttl
    - taxonomy.ttl
    - shapes.ttl
    - context.jsonld
    - queries.sparql
    - library.yaml

audit:

  required: true

  minimum_pass_rate: 100

  required_audits:
    - StructureAudit
    - DependencyAudit
    - ImportAudit
    - RDFAudit
    - SHACLAudit
    - JenaAudit
    - CompilerAudit
    - MappingAudit
    - DomainAudit
    - ReasonerAudit
    - LedgerAudit
    - ControlPlaneAudit
    - ExecutionPlaneAudit
