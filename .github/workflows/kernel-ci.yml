name: Kernel Invariant CI

on:
  push:
  pull_request:

jobs:
  validate-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Add repo to PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Run Global Invariance Matrix
        run: |
          python -m peculiarlibrary.audits.global_invariance_matrix

      - name: Run Kernel Audit
        run: |
          python -m peculiarlibrary.audits.kernel_audit

      - name: Run Execution Plane Audit
        run: |
          python -m peculiarlibrary.audits.execution_plane_audit

      - name: Run Boundary Guard Scan
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))

          from peculiarlibrarian.engine.guards.layer_boundary_guard import LayerBoundaryGuard

          violations = []

          for f in Path("peculiarlibrarian").rglob("*.py"):
              violations.extend(LayerBoundaryGuard.scan_file(str(f)))

          if violations:
              print("❌ CROSS-LAYER VIOLATIONS DETECTED")
              for v in violations:
                  print(v)
              exit(1)

          print("✔ Boundary check passed")
          EOF
