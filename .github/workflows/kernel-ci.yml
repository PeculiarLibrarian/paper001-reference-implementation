name: Kernel Invariant CI

on:
  push:
  pull_request:

jobs:
  validate-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Add repository to PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Run Release Verification
        run: |
          python -m peculiarlibrary.verify

      - name: Run System Verification
        run: |
          python -m peculiarlibrary.system_verification
